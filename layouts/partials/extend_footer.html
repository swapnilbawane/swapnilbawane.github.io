{{ if eq .Type "posts" }}
<button id="read-aloud-btn" style="margin: 1rem 0; padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid var(--border); background: var(--entry); color: var(--primary); cursor: pointer;">🔊 Read Aloud</button>
<script>
(function() {
  var btn = document.getElementById('read-aloud-btn');
  if (!btn) return;
  var speaking = false;
  var keepAliveInterval = null;

  function getVoicesAsync() {
    return new Promise(function(resolve) {
      var voices = window.speechSynthesis.getVoices();
      if (voices.length) {
        resolve(voices);
        return;
      }
      window.speechSynthesis.onvoiceschanged = function() {
        resolve(window.speechSynthesis.getVoices());
      };
    });
  }

  function stopSpeaking() {
    window.speechSynthesis.cancel();
    if (keepAliveInterval) {
      clearInterval(keepAliveInterval);
      keepAliveInterval = null;
    }
    speaking = false;
    btn.textContent = '🔊 Read Aloud';
  }

  btn.addEventListener('click', function() {
    if (speaking) {
      stopSpeaking();
      return;
    }

    var content = document.querySelector('.post-content');
    if (!content) return;

    getVoicesAsync().then(function(voices) {
      var utterance = new SpeechSynthesisUtterance(content.innerText);
      utterance.lang = 'en-US';
      var preferred = voices.find(function(v) { return v.lang === 'en-US'; });
      if (preferred) utterance.voice = preferred;

      utterance.onend = stopSpeaking;
      utterance.onerror = stopSpeaking;

      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
      speaking = true;
      btn.textContent = '⏸️ Stop';

      // Android Chrome silently stops speech after ~15s unless kept alive
      keepAliveInterval = setInterval(function() {
        if (!window.speechSynthesis.speaking) {
          stopSpeaking();
          return;
        }
        window.speechSynthesis.pause();
        window.speechSynthesis.resume();
      }, 10000);
    });
  });
})();
</script>
{{ end }}
